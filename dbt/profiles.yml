olist_postgres:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_POSTGRES_PORT', '5433') | int }}"
      dbname: "{{ env_var('DBT_POSTGRES_DB', 'ecommerce') }}"
      user: "{{ env_var('DBT_POSTGRES_USER', 'ecommerce') }}"
      password: "{{ env_var('DBT_POSTGRES_PASSWORD', 'ecommerce_dev') }}"
      schema: dbt_dev
      threads: 4
      connect_timeout: 10
      retries: 2
