name: olist_analytics
version: 1.0.0
config-version: 2

profile: olist_postgres

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: ["target", "dbt_packages"]

models:
  olist_analytics:
    staging:
      +schema: staging_dbt
      +materialized: view
      +tags: [staging]
    marts:
      +schema: warehouse_dbt
      +materialized: table
      +tags: [kimball]
    analytics:
      +schema: analytics_dbt
      +materialized: table
      +tags: [bi, presentation]

tests:
  olist_analytics:
    +store_failures: true
    +schema: dbt_test_failures
